services:
  - type: web
    name: swimcoach-api
    runtime: python
    buildCommand: "pip install -r backend/requirements.txt"
    startCommand: "uvicorn backend.main:app --host 0.0.0.0 --port $PORT --workers 4"
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: PYTHONDONTWRITEBYTECODE
        value: "1"
      - key: FRONTEND_URL
        fromEnvVar: FRONTEND_URL
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: swimcoach-db
          property: connectionString
      - key: MP_ACCESS_TOKEN
        sync: false
      - key: MP_PUBLIC_KEY
        sync: false
      - key: MP_WEBHOOK_SECRET
        sync: false
      - key: MP_PREAPPROVAL_PLAN_ID
        sync: false
      - key: ADSENSE_CLIENT_ID
        sync: false
      - key: ADSENSE_SLOT_BANNER
        sync: false
      - key: ADSENSE_SLOT_INTERSTITIAL
        sync: false
      - key: UMAMI_WEBSITE_ID
        sync: false
      - key: SENTRY_DSN
        sync: false

databases:
  - name: swimcoach-db
    plan: starter
    ipAllowList: []