# SwimCoach on Render — declarative config (dashboard may override; comments only).
# Prod truth: https://swimcoach-ss5j.onrender.com (Free plan + sleep; see docs/ops.md).
# NOTE (2026-10): live DB is the Supabase pooler (per ops runbook), set as a
# manual DATABASE_URL in the dashboard, which takes precedence over the
# fromDatabase block below. If Render ever re-provisions from this file,
# confirm DATABASE_URL still points at Supabase before trusting the deploy.
services:
  - type: web
    name: swimcoach-api
    runtime: python  # Docker uses python:3.13-slim; keep backend/requirements.txt pinned
    buildCommand: "pip install -r backend/requirements.txt"
    # $PORT is injected by Render; --workers 4 (Free has 0.5 CPU — fine for current traffic)
    startCommand: "uvicorn backend.main:app --host 0.0.0.0 --port $PORT --workers 4"
    healthCheckPath: /api/health  # static dict, no DB — green even if DB is down
    autoDeploy: true  # every push to main redeploys (~2 min); avoid pushing right before demos/AdSense crawls
    envVars:
      - key: ENVIRONMENT  # production: disables /docs + /redoc, secure cookies
        value: production
      - key: PYTHONUNBUFFERED  # unbuffered logs (need them for Render log tail debugging)
        value: "1"
      - key: PYTHONDONTWRITEBYTECODE  # no __pycache__ in container
        value: "1"
      # sync:false = set once in dashboard, never overwritten by file syncs:
      - key: FRONTEND_URL  # must be https://swimcoach-ss5j.onrender.com (CORS allowlist)
        sync: false
      - key: SECRET_KEY  # auto-generated by Render; rotating it logs out everyone
        generateValue: true
      - key: DATABASE_URL  # SEE NOTE above: dashboard Supabase pooler URI wins over fromDatabase
        fromDatabase:
          name: swimcoach-db
          property: connectionString
      - key: MP_ACCESS_TOKEN  # MercadoPago prod: APP_USR-… (TEST-… only for sandbox)
        sync: false
      - key: MP_PUBLIC_KEY
        sync: false
      - key: MP_WEBHOOK_SECRET  # empty = auto-plan mode (no signature check); whsec_… when selling
        sync: false
      - key: MP_PREAPPROVAL_PLAN_ID  # pro_monthly dev; real plan id from MP dashboard in prod
        sync: false
      # UNWIRED (2026-10): backend ignores these; live slot IDs are hardcoded in
      # frontend (see .env.example + backend/services/attic_ads_service.py)
      - key: ADSENSE_CLIENT_ID
        sync: false
      - key: ADSENSE_SLOT_BANNER
        sync: false
      - key: ADSENSE_SLOT_INTERSTITIAL
        sync: false
      - key: UMAMI_WEBSITE_ID  # optional analytics; empty = off
        sync: false
      - key: SENTRY_DSN  # optional error tracking; empty = off
        sync: false

databases:
  - name: swimcoach-db  # legacy Render Postgres declaration; live traffic uses Supabase (see NOTE)
    plan: starter
    ipAllowList: []
